name: Java

on: 
  pull_request_target:
    branches:
      - 'develop'
    types:
      - closed

jobs:
  build:
    if: github.event.review.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile
  tests:
    needs: build
    
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: java 

    steps:
      - name: Testes unitários
        run: mvn test


