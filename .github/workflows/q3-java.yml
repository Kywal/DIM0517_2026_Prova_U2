name: Java

on:
  pull_request_target:
    branches:
      - 'develop'
    types:
      - closed

jobs:
  build:
    if: github.event.review.merged == true
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: java
    ENV:
      TAG="build-${{ github.run_id }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Taggea
        run: | 
          git tag $TAG
          git push --tags 

