name: Java q4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Teste
        run: mvn test

      - name: build docker image
        run: docker build -t java_app:1.0 .

      - name: start container
        run: docker run java_app
